<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homeostasis WebQuest: The Body’s Balancing Act</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6fbfa;--fg:#12302b;--mut:#4d6b66;--card:#fff;--line:#cfe3df;--teal:#0f766e;--green:#14532d;--tint:#e1f2ef;--on:#fff;--warn:#b45309;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1f1c;--fg:#e4f3f0;--mut:#9dbab5;--card:#12302b;--line:#255049;--teal:#2dd4bf;--green:#86efac;--tint:#15423b;--on:#06201c;--warn:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1f1c;--fg:#e4f3f0;--mut:#9dbab5;--card:#12302b;--line:#255049;--teal:#2dd4bf;--green:#86efac;--tint:#15423b;--on:#06201c;--warn:#fbbf24;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.65 Poppins,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--line);z-index:9}
nav{max-width:980px;margin:auto;display:flex;gap:4px;padding:8px 12px;overflow-x:auto}
nav a{color:var(--mut);text-decoration:none;padding:6px 12px;border-radius:99px;white-space:nowrap;font-weight:500;font-size:14px}
nav a:hover{background:var(--tint)}
nav a[aria-current=page]{background:var(--teal);color:var(--on)}
main{max-width:980px;margin:auto;padding:28px 16px 56px}
h1{font-size:clamp(30px,6vw,52px);line-height:1.1;margin:0 0 12px;color:var(--green);letter-spacing:-.02em}
h2{font-size:28px;margin:0 0 8px;color:var(--green)}
h3{font-size:19px;margin:24px 0 6px;color:var(--teal)}
p,li{max-width:70ch}
.hero{display:grid;gap:24px;grid-template-columns:1.1fr .9fr;align-items:center}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.lead{font-size:18px;color:var(--mut)}
.btn{display:inline-block;background:var(--teal);color:var(--on);padding:10px 22px;border-radius:10px;text-decoration:none;font-weight:600;border:0;cursor:pointer;font:600 15px Poppins,Arial,sans-serif}
.btn.alt{background:var(--tint);color:var(--teal)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid .card{margin:0}
.meter{height:14px;border-radius:99px;background:linear-gradient(90deg,#38bdf8,#2dd4bf 40%,#2dd4bf 60%,#fb923c);position:relative;margin:18px 0 8px}
.meter i{position:absolute;top:-5px;width:6px;height:24px;border-radius:3px;background:var(--fg);left:50%;transition:left .2s}
input[type=range]{width:100%;accent-color:var(--teal)}
.out{font-weight:600;color:var(--green);min-height:3.3em}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:7px 14px;border-radius:99px;cursor:pointer;font:500 14px Poppins,Arial,sans-serif}
.tabs button[aria-pressed=true]{background:var(--teal);color:var(--on);border-color:var(--teal)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;font-size:14px}
th{background:var(--tint)}
details{background:var(--tint);border-radius:10px;padding:10px 14px;margin:10px 0}
summary{cursor:pointer;font-weight:600;color:var(--green)}
.q{margin:14px 0}
.q button{display:block;width:100%;text-align:left;margin:5px 0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer;font:400 15px Poppins,Arial,sans-serif}
.q button.ok{background:#16a34a;color:#fff;border-color:#16a34a}
.q button.no{background:#dc2626;color:#fff;border-color:#dc2626}
.todo{color:var(--warn);font-weight:500}
footer{text-align:center;color:var(--mut);font-size:13px;padding:20px}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
</style>
</head>
<body>
<header><nav id="nav" aria-label="WebQuest pages"></nav></header>
<main id="app"></main>
<footer>Homeostasis WebQuest · Made by Junior Scientists</footer>
<script>
var PAGES=[["home","Home"],["introduction","Introduction"],["task","Task"],["process","Process"],["resources","Resources"],["evaluation","Evaluation"],["conclusion","Conclusion"],["about","References & About Us"]];
var T=[
{n:"1. Understanding Homeostasis",k:["Homeostasis keeps the internal environment (the fluids around and inside cells) stable.","The body controls temperature, blood glucose, water balance, pH, and blood pressure.","Each variable has a set point, the normal value the body tries to keep.","When a variable drifts from its set point, the body responds to bring it back."],a:"Activity 1: Homeostasis Detective",b:"You are a detective. For each case, name the change, the body’s response, and the balance being protected.",c:["Maria runs a 5K at noon and starts sweating.","Jun skips lunch and feels shaky and hungry.","Ana drinks a big bottle of water and needs to urinate often.","Leo stands in the cold rain and his teeth chatter."],g:["What changed in each case?","What did the body do in response?","What would happen if the body did not respond?"],e:"Maria: temperature rises, sweating and wider skin blood vessels release heat. Jun: blood glucose falls, hunger and hormones raise it. Ana: extra water, kidneys make dilute urine. Leo: temperature drops, shivering makes heat."},
{n:"2. Feedback Mechanisms",k:["A feedback loop has a stimulus, a receptor (detects change), a control center (processes it), and an effector (responds).","Negative feedback reverses a change and returns the body to its set point. Most homeostasis uses it.","Positive feedback amplifies a change until a process is complete, as in childbirth contractions and blood clotting."],a:"Activity 2: Feedback Mechanism Challenge",b:"Classify each example as negative or positive feedback, then identify its stimulus, receptor, control center, and effector.",c:["Body temperature rises, so sweating starts and temperature falls.","Contractions push the baby against the cervix, which releases more oxytocin and stronger contractions.","Blood sugar rises after a meal, so insulin lowers it.","A cut triggers platelets that attract more platelets until a clot forms."],g:["How does negative feedback differ from positive feedback?","Why is negative feedback more common in homeostasis?","Why must positive feedback have an end point?"],e:"1 negative, 2 positive, 3 negative, 4 positive. Negative feedback reverses a change, which keeps conditions steady. Positive feedback must end or it would keep escalating and cause harm."},
{n:"3. Thermoregulation",k:["Normal body temperature is about 37 °C. The hypothalamus is the control center, the body’s thermostat.","Too hot: sweating (evaporation cools skin) and vasodilation (skin blood vessels widen and release heat).","Too cold: shivering (muscles make heat) and vasoconstriction (skin blood vessels narrow and save heat)."],a:"Activity 3: Body Under Pressure",b:"A student goes from an air-conditioned room to a noon basketball game, then sits in front of a strong fan. Draw the feedback loop for the game and explain the fan.",c:[],g:["What is the stimulus during the game?","Which part of the brain detects the change?","Name two ways the body cools itself.","Why does the fan make the student feel cooler?"],e:"Rising body temperature; the hypothalamus; sweating and vasodilation; moving air speeds up evaporation of sweat, which removes heat."},
{n:"4. Blood Glucose Regulation",k:["Cells need glucose for energy, so blood glucose must stay in a normal range.","The pancreas detects glucose levels and releases hormones.","After a meal, insulin helps cells take in glucose and the liver store it as glycogen, so blood glucose falls.","Between meals, glucagon makes the liver release glucose, so blood glucose rises.","In diabetes, this regulation does not work properly."],a:"Guide questions",b:"Use the Resources page, then answer in your notes.",c:[],g:["Which organ detects blood glucose?","What do insulin and glucagon each do?","Why is this negative feedback?"],e:"The pancreas; insulin lowers and glucagon raises blood glucose; each response reverses the original change."},
{n:"5. Osmoregulation",k:["Osmoregulation is the control of water and salt balance.","The kidneys filter blood and adjust how much water leaves in urine.","When dehydrated, the brain releases ADH, so the kidneys reabsorb more water, urine becomes concentrated, and you feel thirsty.","With too much water, less ADH is released and urine is more dilute."],a:"Activity 4: Create Your Homeostasis Infographic",b:"Make a digital infographic (Canva or similar) with at least three examples. For each, show the stimulus, receptor, control center, effector, and result. Add sources.",c:[],g:["Which examples did you choose and why?","Is each one negative or positive feedback?","What happens if the body fails to respond?"],e:"Your infographic is graded with the rubric on the Task page."}
];
var Q=[["Which part of a feedback loop detects a change?",["Effector","Receptor","Hormone"],1],["Which part of the brain is the body’s thermostat?",["Hypothalamus","Cerebellum","Medulla"],0],["Which hormone lowers blood glucose?",["Glucagon","ADH","Insulin"],2],["What does ADH make the kidneys do?",["Reabsorb more water","Remove more water","Make glucose"],0],["Vasoconstriction helps the body…",["Lose heat","Conserve heat","Store glucose"],1]];
function L(a){return "<ul>"+a.map(function(x){return "<li>"+x+"</li>"}).join("")+"</ul>"}
var P={
home:function(){return '<div class="hero"><div><h1>Homeostasis: The Body’s Balancing Act</h1><p class="lead">Welcome, Junior Scientists! Discover how your body keeps itself stable through scientific exploration and interactive challenges.</p><p><b>How does your body stay balanced when everything around you keeps changing?</b></p><a class="btn" href="#introduction">Begin your mission</a></div><div class="card"><b>Try it: set the body’s temperature</b><div class="meter"><i id="mk"></i></div><input id="sl" type="range" min="34" max="40" step="0.1" value="37" aria-label="Body temperature in degrees Celsius"><div>Body temperature: <b id="tv">37.0 °C</b></div><p class="out" id="ro"></p></div></div><h3>What you will do</h3><div class="grid"><div class="card"><b>Learn</b><br>Explore feedback loops, temperature, glucose, and water balance.</div><div class="card"><b>Investigate</b><br>Solve cases and analyze real-life situations.</div><div class="card"><b>Show it</b><br>Build an infographic and take the quiz.</div></div>'},
introduction:function(){return '<h2>Introduction</h2><div class="card"><b>Think about it:</b> Why does your body sweat when you exercise under the hot sun, but shiver when you are exposed to cold?</div><h3>What is homeostasis?</h3><p><b>Homeostasis</b> is the ability of the body to keep a stable internal environment even when conditions inside or outside it change. The word comes from the Greek <i>homeo</i> (similar) and <i>stasis</i> (standing still).</p><h3>Why it matters</h3><p>Cells work properly only within narrow ranges of temperature, water, pH, and nutrients. Outside those ranges cells are damaged and organs can fail. Homeostasis keeps the body within safe limits.</p><h3>Homeostasis in everyday life</h3>'+L(["Sweating after running in the heat","Shivering on a cold morning","Feeling thirsty after a long day","Feeling hungry or full as blood sugar changes","Breathing faster after climbing stairs"])+'<h3>Learning objectives</h3><p>After this WebQuest, you should be able to:</p><ol><li>Define homeostasis and explain why it is important.</li><li>Describe negative and positive feedback.</li><li>Explain how the body regulates temperature.</li><li>Explain how the body regulates blood glucose.</li><li>Explain how the body regulates water balance.</li></ol>'},
task:function(){return '<h2>Task</h2><div class="card"><b>Your mission:</b> You are junior scientists assigned to investigate how the human body maintains internal stability. Explore different homeostatic mechanisms, analyze real-life situations, and show your understanding through interactive activities.</div><h3>What to do</h3><ol><li>Read the Introduction and the learning objectives.</li><li>Work through the five topics in Process.</li><li>Complete the four activities and answer every guide question.</li><li>Use Resources to support your investigation.</li><li>Create a digital infographic with at least three examples of homeostasis.</li><li>Take the 20-item quiz in Evaluation.</li><li>Answer the reflection questions in Conclusion.</li></ol><h3>Final output</h3><p>A digital infographic that shows, for each of three examples: the change, the receptor, the effector, and how balance is restored.</p><h3>Submission</h3><ul><li>Save as PNG or PDF named <i>Surname_Homeostasis_Infographic</i>.</li><li>Submit to <span class="todo">[insert platform or link]</span> by <span class="todo">[insert deadline]</span>.</li></ul><h3>Infographic rubric (20 points)</h3><div class="scroll"><table><tr><th>Criteria</th><th>4</th><th>3</th><th>2</th><th>1</th></tr><tr><td>Scientific accuracy</td><td>All correct</td><td>Minor errors</td><td>Several errors</td><td>Mostly incorrect</td></tr><tr><td>Completeness</td><td>All parts</td><td>One missing</td><td>Two missing</td><td>Incomplete</td></tr><tr><td>Organization</td><td>Very clear</td><td>Mostly clear</td><td>Somewhat unclear</td><td>Confusing</td></tr><tr><td>Creativity and design</td><td>Highly creative</td><td>Creative</td><td>Some effort</td><td>Little effort</td></tr><tr><td>Sources</td><td>All cited</td><td>Most cited</td><td>Few cited</td><td>None</td></tr></table></div>'},
process:function(){var t=T[S.t];return '<h2>Process</h2><p>Pick a topic, read the key ideas, then do the activity.</p><div class="tabs">'+T.map(function(x,i){return '<button data-t="'+i+'" aria-pressed="'+(i==S.t)+'">'+x.n+'</button>'}).join("")+'</div><div class="card"><h3 style="margin-top:0">'+t.n+'</h3><b>Key ideas</b>'+L(t.k)+'<h3>'+t.a+'</h3><p>'+t.b+'</p>'+(t.c.length?'<ol>'+t.c.map(function(x){return '<li>'+x+'</li>'}).join("")+'</ol>':'')+'<b>Guide questions</b><ol>'+t.g.map(function(x){return '<li>'+x+'</li>'}).join("")+'</ol><details><summary>Check expected answers</summary><p>'+t.e+'</p></details><p class="todo">Interactive link: [insert Google Form, Canva, or Wordwall link]</p></div>'},
resources:function(){return '<h2>Resources</h2><p>Reliable materials to support your investigation. Add topic-specific videos and readings under each link.</p><div class="grid"><div class="card"><b>Khan Academy: Biology</b><br>Videos and articles on all five topics.<br><a href="https://www.khanacademy.org/science/biology" target="_blank" rel="noopener">Open</a></div><div class="card"><b>Biology LibreTexts</b><br>Free open textbook for deeper reading.<br><a href="https://bio.libretexts.org/" target="_blank" rel="noopener">Open</a></div><div class="card"><b>HHMI BioInteractive</b><br>Interactives and videos on feedback, temperature, and glucose.<br><a href="https://www.biointeractive.org/" target="_blank" rel="noopener">Open</a></div><div class="card"><b>PhET Simulations</b><br>Science simulations to explore and test ideas.<br><a href="https://phet.colorado.edu/" target="_blank" rel="noopener">Open</a></div></div><h3>Resources by topic</h3><div class="scroll"><table><tr><th>Topic</th><th>Resource</th></tr><tr><td>Understanding Homeostasis</td><td class="todo">[add video]</td></tr><tr><td>Feedback Mechanisms</td><td class="todo">[add reading or diagram]</td></tr><tr><td>Thermoregulation</td><td class="todo">[add video or simulation]</td></tr><tr><td>Blood Glucose Regulation</td><td class="todo">[add resource]</td></tr><tr><td>Osmoregulation</td><td class="todo">[add resource]</td></tr></table></div>'},
evaluation:function(){return '<h2>Evaluation</h2><p>The full quiz is a <b>20-item Google Forms test</b>: 10 multiple choice, 5 true or false, and 5 identification with choices. Each item is 1 point (20 total). Passing score: <span class="todo">[insert]</span>. You see your score right after you submit.</p><p><a class="btn" href="#evaluation" id="fl">Start the quiz</a> <span class="todo">[replace with your Google Forms link or embed]</span></p><div class="scroll"><table><tr><th>Topic</th><th>Items</th></tr><tr><td>Understanding Homeostasis</td><td>3</td></tr><tr><td>Feedback Mechanisms</td><td>5</td></tr><tr><td>Thermoregulation</td><td>4</td></tr><tr><td>Blood Glucose Regulation</td><td>4</td></tr><tr><td>Osmoregulation</td><td>4</td></tr><tr><td><b>Total</b></td><td><b>20</b></td></tr></table></div><h3>Quick practice (not graded)</h3>'+Q.map(function(q,i){return '<div class="q"><b>'+(i+1)+'. '+q[0]+'</b>'+q[1].map(function(o,j){return '<button data-q="'+i+'" data-o="'+j+'">'+o+'</button>'}).join("")+'</div>'}).join("")},
conclusion:function(){return '<h2>Conclusion</h2><h3>Summary</h3><p>Homeostasis is the body’s way of keeping its internal environment stable. Receptors detect changes, control centers like the brain process them, and effectors such as muscles, glands, and organs respond.</p><h3>Key concepts</h3>'+L(["Homeostasis keeps temperature, glucose, and water within safe limits.","Negative feedback reverses changes; positive feedback amplifies them until a process ends.","The hypothalamus regulates temperature through sweating, shivering, vasodilation, and vasoconstriction.","Insulin and glucagon from the pancreas regulate blood glucose.","The kidneys and ADH regulate water balance."])+'<h3>In real life</h3><p>Knowing how homeostasis works helps you drink enough water in hot weather, eat balanced meals, dress for the temperature, and notice warning signs such as constant thirst or fatigue.</p><h3>Reflect</h3><ol><li>Why is homeostasis important for the survival of living organisms?</li><li>What could happen if the body fails to maintain internal balance?</li><li>What is one example of homeostasis you experience daily?</li><li>How can understanding homeostasis help you take care of your body?</li></ol><div class="card"><b>Mission accomplished, Junior Scientists!</b> Keep noticing how your body keeps its balance every day.</div>'},
about:function(){return '<h2>References & About Us</h2><h3>References</h3>'+L(["Khan Academy. (n.d.). <i>Biology</i>. https://www.khanacademy.org/science/biology","LibreTexts. (n.d.). <i>Biology LibreTexts</i>. https://bio.libretexts.org/","Howard Hughes Medical Institute. (n.d.). <i>BioInteractive</i>. https://www.biointeractive.org/","University of Colorado Boulder. (n.d.). <i>PhET interactive simulations</i>. https://phet.colorado.edu/",'<span class="todo">[add other sources, videos, and image credits in APA 7th edition]</span>'])+'<h3>About us</h3>'+L(['Group members: <span class="todo">[names]</span>','Course, year, and section: <span class="todo">[insert]</span>','Subject: <span class="todo">[insert]</span>','Instructor: <span class="todo">[insert]</span>','Acknowledgments: <span class="todo">[insert]</span>'])}
};
var S={t:0};
function route(){var q=new URLSearchParams(location.search).get("p");var h=location.hash?location.hash.slice(1):(q||"home");if(!P[h])h="home";document.querySelector("header").style.display=q?"none":"";document.getElementById("nav").innerHTML=PAGES.map(function(p){return '<a href="#'+p[0]+'"'+(p[0]==h?' aria-current="page"':'')+'>'+p[1]+'</a>'}).join("");document.getElementById("app").innerHTML=P[h]();document.title=(h=="home"?"":PAGES.filter(function(p){return p[0]==h})[0][1]+" · ")+"Homeostasis WebQuest";if(h=="home")meter();window.scrollTo(0,0)}
function meter(){var s=document.getElementById("sl");function u(){var v=+s.value,o;document.getElementById("tv").textContent=v.toFixed(1)+" °C";document.getElementById("mk").style.left=((v-34)/6*100)+"%";if(v>=37.8)o="Too warm: the hypothalamus signals sweat glands and widens skin blood vessels to release heat.";else if(v<=36.2)o="Too cool: the hypothalamus triggers shivering and narrows skin blood vessels to keep heat.";else o="Near the set point of about 37 °C: no strong response needed.";document.getElementById("ro").textContent=o}s.oninput=u;u()}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.t!==undefined){S.t=+b.dataset.t;document.getElementById("app").innerHTML=P.process()}else if(b.dataset.q!==undefined){var i=+b.dataset.q,j=+b.dataset.o;b.parentNode.querySelectorAll("button").forEach(function(x,k){x.classList.remove("ok","no");if(k==Q[i][2])x.classList.add("ok");else if(k==j)x.classList.add("no")})}});
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
