<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body Temperature Slider</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6fbfa;--fg:#12302b;--card:#fff;--line:#cfe3df;--teal:#0f766e;--green:#14532d;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0b1f1c;--fg:#e4f3f0;--card:#12302b;--line:#255049;--teal:#2dd4bf;--green:#86efac;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:400 16px/1.6 Poppins,Arial,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;max-width:560px;margin:auto}
.meter{height:14px;border-radius:99px;background:linear-gradient(90deg,#38bdf8,#2dd4bf 40%,#2dd4bf 60%,#fb923c);position:relative;margin:18px 0 8px}
.meter i{position:absolute;top:-5px;width:6px;height:24px;border-radius:3px;background:var(--fg);left:50%;transition:left .2s}
input[type=range]{width:100%;accent-color:var(--teal)}
.out{font-weight:600;color:var(--green);min-height:3.3em;margin:8px 0 0}
</style>
</head>
<body>
<div class="card">
<b>Try it: set the body’s temperature</b>
<div class="meter"><i id="mk"></i></div>
<input id="sl" type="range" min="34" max="40" step="0.1" value="37" aria-label="Body temperature in degrees Celsius">
<div>Body temperature: <b id="tv">37.0 °C</b></div>
<p class="out" id="ro"></p>
</div>
<script>
var s=document.getElementById("sl");
function u(){var v=+s.value,o;document.getElementById("tv").textContent=v.toFixed(1)+" °C";document.getElementById("mk").style.left=((v-34)/6*100)+"%";if(v>=37.8)o="Too warm: the hypothalamus signals sweat glands and widens skin blood vessels to release heat.";else if(v<=36.2)o="Too cool: the hypothalamus triggers shivering and narrows skin blood vessels to keep heat.";else o="Near the set point of about 37 °C: no strong response needed.";document.getElementById("ro").textContent=o}
s.oninput=u;u();
</script>
</body>
</html>
